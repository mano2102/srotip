spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      # Use ErrorHandlingDeserializer to prevent "Poison Pill" infinite loops
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      
      properties:
        # Delegate the actual JSON work to JsonDeserializer
        spring.deserializer.value.delegate.class: 
        
        # ✅ FIX 1: Trust the incoming package from product-service
        spring.json.trusted.packages: "com.srotip.inventoryservice.dto,com.srotip.productservice.event"
        
        # ✅ FIX 2: Better approach for Microservices - ignore headers and map to local DTOs
        # This tells Kafka: "I don't care what the sender called the class; 
        # map it to my local DTO based on the topic it came from."
        spring.json.use.type.headers: false
        
        # Explicit mapping ensures topic 'product-created-topic' always maps to your local DTO
        spring.json.type.mapping: >
          product-created-topic:com.srotip.inventoryservice.dto.InventoryCreateEventDTO,
          order-placed-topic:com.srotip.inventoryservice.dto.InventoryReduceEventDTO

server:
  port: ${INVENTORY_SERVICE_PORT}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/